name: bonaso-local-stack

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: /api
        BACKEND_API_URL: http://backend:8000/api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
      BACKEND_API_URL: http://backend:8000/api
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  backend:
    build:
      context: ${DJANGO_BACKEND_PATH:-C:/Projects/django_backend}
      dockerfile: Dockerfile
    environment:
      DOTENV_OVERRIDE: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-local-docker-secret-key-change-me-1234567890abcdef1234567890}"
      DEBUG: "${DJANGO_DEBUG:-True}"
      DATABASE_URL: "${DJANGO_DATABASE_URL:-postgres://bonaso:bonaso@postgres:5432/bonaso}"
      DB_SSL_REQUIRE: "False"
      ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
      CORS_ALLOWED_ORIGINS: "${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000}"
      USE_X_FORWARDED_PROTO: "False"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      PORT: "8000"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bonaso}"
      POSTGRES_USER: "${POSTGRES_USER:-bonaso}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bonaso}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bonaso} -d ${POSTGRES_DB:-bonaso}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  backend_media:
