services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${DOCKER_NEXT_PUBLIC_API_URL:-/api}
        BACKEND_API_URL: ${DOCKER_BACKEND_API_URL:-http://host.docker.internal:18000/api}
    environment:
      NODE_ENV: production
      PORT: 13000
      NEXT_PUBLIC_API_URL: ${DOCKER_NEXT_PUBLIC_API_URL:-/api}
      BACKEND_API_URL: ${DOCKER_BACKEND_API_URL:-http://host.docker.internal:18000/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-13000}:13000"
